version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskme_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskme_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/taskme?schema=public
      - JWT_SECRET=production_secret_change_me
      - PORT=5000
      - FRONTEND_URL=http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskme_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
